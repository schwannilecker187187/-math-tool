<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; font-weight: 500; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #86868b;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #0077ed; }
        #canvas-container { margin-top: 20px; max-width: 100%; display: none; }
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Screenshot Generator</h2>
    
    <div class="form-group">
        <label>TESTCODE</label>
        <input type="text" id="testcode" value="0001-6374">
    </div>
    
    <div class="form-group">
        <label>CAS-Modus</label>
        <select id="cas">
            <option value="Aus">Aus</option>
            <option value="An">An</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>DATUM</label>
        <input type="text" id="datum" value="31.05.2026">
    </div>
    
    <div class="form-group">
        <label>DAUER</label>
        <input type="text" id="dauer" value="00:41">
    </div>
    
    <div class="form-group">
        <label>STARTZEIT</label>
        <input type="text" id="startzeit" value="15:20">
    </div>
    
    <div class="form-group">
        <label>ENDZEIT</label>
        <input type="text" id="endzeit" value="15:21">
    </div>
    
    <div class="form-group">
        <label>SITZUNG ID</label>
        <input type="text" id="sitzung" value="4CEH45">
    </div>
    
    <div class="form-group">
        <label>VERSION</label>
        <input type="text" id="version" value="6.3.1">
    </div>
    
    <button onclick="generateImage()">Bild generieren & herunterladen</button>
</div>

<div id="canvas-container">
    <canvas id="screenshotCanvas"></canvas>
</div>

<script>
function generateImage() {
    const canvas = document.getElementById('screenshotCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    
    img.src = 'background.png';
    
    img.onload = function() {
        canvas.width = img.width;
        canvas.height = img.height;
        
        // 1. Hintergrund zeichnen
        ctx.drawImage(img, 0, 0);
        
        // Universelle, saubere serifenlose Schriftart
        const fontName = 'sans-serif';
        const xMargin = 90;
        
        // 2. Oberer Hinweistext (Exakt ausgerichtet)
        ctx.fillStyle = '#000000';
        ctx.font = `300 32px ${fontName}`;
        ctx.fillText("Zeigen Sie bitte Ihrer Lehrkraft diesen Screenshot. Zusätzlich wurde ein", xMargin, 105);
        ctx.fillText("Screenshot unter Fotos gespeichert.", xMargin, 150);
        
        // Start-Y für die Blöcke stark nach oben korrigiert
        let currentY = 245; 
        
        // Hilfsfunktion mit komplett reduzierten Schriftgrößen und engen Abständen
        function drawBlock(label, value, yPos) {
            // Die kleinen grauen Überschriften
            ctx.fillStyle = '#7d7d7d'; 
            ctx.font = `400 24px ${fontName}`; 
            ctx.fillText(label, xMargin, yPos);
            
            // Der eigentliche Wert (Deutlich kleiner & dünner gezogen über leichtes Tracking-Äquivalent)
            yPos += 52; 
            ctx.fillStyle = '#000000'; 
            ctx.font = `100 52px ${fontName}`; // Von 68px auf 52px geschrumpft!
            ctx.fillText(value, xMargin, yPos);
            
            return yPos + 78; // Enger Sprung zum nächsten Block, damit nichts nach unten wegläuft
        }
        
        const testcode = document.getElementById('testcode').value;
        const cas = document.getElementById('cas').value;
        const datum = document.getElementById('datum').value;
        const dauer = document.getElementById('dauer').value;
        const startzeit = document.getElementById('startzeit').value;
        const endzeit = document.getElementById('endzeit').value;
        const sitzung = document.getElementById('sitzung').value;
        const version = document.getElementById('version').value;
        
        // Blöcke nacheinander stempeln
        currentY = drawBlock("TESTCODE:", testcode, currentY);
        
        // CAS-Modus Zeile (Schlanker, kleiner und farblich angepasst)
        ctx.fillStyle = '#147efb'; 
        ctx.font = `400 34px ${fontName}`;
        ctx.fillText(`CAS-Modus: ${cas}`, xMargin, currentY);
        currentY += 105; 
        
        // Restliche Blöcke
        currentY = drawBlock("DATUM:", datum, currentY);
        currentY = drawBlock("DAUER:", dauer, currentY);
        currentY = drawBlock("STARTZEIT:", startzeit, currentY);
        currentY = drawBlock("ENDZEIT:", endzeit, currentY);
        currentY = drawBlock("SITZUNG ID:", sitzung, currentY);
        
        // Version ganz unten
        ctx.fillStyle = '#7d7d7d';
        ctx.font = `400 24px ${fontName}`;
        ctx.fillText("VERSION:", xMargin, currentY);
        currentY += 52;
        ctx.fillStyle = '#000000';
        ctx.font = `100 52px ${fontName}`;
        ctx.fillText(version, xMargin, currentY);
        
        // 3. Download
        const link = document.createElement('a');
        link.download = 'ipad_screenshot.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    };
}
</script>

</body>
</html>
